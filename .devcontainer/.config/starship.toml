"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
palette = 'catppuccin_mocha'

format = """
[╭─](fg:surface1)\
$os\
$container\
[](fg:blue bg:surface1)\
$username\
[](fg:surface1)\
$directory\
$git_branch\
$git_status\
$java\
$package\
$fill\
$time\
$status\
$cmd_duration\
$line_break\
[╰─](fg:surface1)$character"""

# --- THE FIRST PILL (OS + CONTAINER + USER) ---
[os]
disabled = false
format = "[](fg:blue)[$symbol](bg:blue fg:crust)"

[container]
format = "[ $symbol ](bg:blue fg:crust)"

[username]
show_always = true
format = "[ $user](bg:surface1)"

# --- DIRECTORY ---
[directory]
style = "bg:surface0 fg:sapphire"
format = "[─](fg:surface1)[](fg:sapphire)[](bg:sapphire fg:crust)[](fg:sapphire bg:surface0)[ $path ]($style)[](fg:surface0)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Desktop" = ""
"Documents" = ""
"Downloads" = ""
"Music" = ""
"Pictures" = ""
"Developer" = "󰲋"
"Videos" = ""

[fill]
symbol = "─"
style = "fg:surface1"

# --- GIT ---
[git_branch]
symbol = ""
style = "bg:surface0 fg:lavender"
format = "[─](fg:surface1)[](fg:lavender)[$symbol](bg:lavender fg:crust)[](fg:lavender bg:surface0)[ $branch ]($style)[](fg:surface0)"

[git_status]
style = "bg:surface0 fg:mauve"
format = "[─](fg:surface1)[](fg:mauve)[](bg:mauve fg:crust)[](fg:mauve bg:surface0)[$all_status$ahead_behind]($style)[](fg:surface0)"

# --- LANGUAGES & TOOLS ---
[java]
symbol = ""
style = "bg:surface0 fg:blue"
format = "[─](fg:surface1)[](fg:blue)[$symbol](bg:blue fg:crust)[](fg:blue bg:surface0)[ $version]($style)[](fg:surface0)"

[package]
symbol = "󰏗"
style = "bg:surface0 fg:blue"
format = "[─](fg:surface1)[](fg:blue)[$symbol](bg:blue fg:crust)[](fg:blue bg:surface0)[ $version]($style)[](fg:surface0)"

# --- UTILITIES ---
[status]
disabled = false
style = "fg:red bg:surface0"
format = "[─](fg:surface1)[](fg:red)[✘](bg:red fg:crust)[](fg:red bg:surface0)[$status]($style)[](fg:surface0)"

[cmd_duration]
min_time = 1000
style = "bg:surface0 fg:yellow"
format = "[─](fg:surface1)[](fg:yellow)[󱐋](bg:yellow fg:crust)[](fg:yellow bg:surface0)[$duration]($style)[](fg:surface0)"

[time]
disabled = false
style = "bg:surface0 fg:blue"
format = "[─](fg:surface1)[](fg:blue)[](bg:blue fg:crust)[](fg:blue bg:surface0)[$time]($style)[](fg:surface0)"

[character]
success_symbol = "[❯](bold fg:green)"
error_symbol = "[❯](bold fg:red)"

